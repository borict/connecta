server:
  port: 8082

spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/posts_db
    username: ${POSTGRES_USER:connecta}
    password: ${POSTGRES_PASSWORD:connecta}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 2000
          social-service:
            connectTimeout: 2000
            readTimeout: 2000

connecta:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
  storage:
    local:
      base-dir: ${CONNECTA_STORAGE_DIR:./uploads}
      public-base-url: ${CONNECTA_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/media}
  azure:
    servicebus:
      connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
      topic: ${AZURE_SERVICEBUS_TOPIC:connecta-events}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
      social-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
  timelimiter:
    instances:
      user-service:
        timeoutDuration: 2s
      social-service:
        timeoutDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
