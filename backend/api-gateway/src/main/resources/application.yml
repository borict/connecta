server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-api
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: user-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
        - id: post-media
          uri: ${POST_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/media/posts/**
        - id: user-media
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/media/**
        - id: post-api
          uri: ${POST_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/posts/**

connecta:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info
