server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-api
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: user-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
        - id: post-media
          uri: ${POST_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/media/posts/**
        - id: user-media
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/media/**
        - id: post-api
          uri: ${POST_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/posts/**
        - id: social-api
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/social/**
        - id: social-feed
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/feed,/api/feed/**
        - id: notification-api
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**
        - id: message-api
          uri: ${MESSAGE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/conversations,/api/conversations/**
        - id: message-ws
          uri: ${MESSAGE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/ws,/ws/**

connecta:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
